name: Neuroharmonics
description: >-
  NeuroHarmonics is a London-based neurotechnology company and UCL spin-out developing
  non-invasive brain-health hardware based on focused ultrasound neuromodulation. Its
  wearable headset uses precisely focused sound waves to safely modulate deep brain
  circuits without surgery, an MRI, or head shaving, aiming to turn expensive, invasive
  neuromodulation into scalable, continuous at-home therapy for neurological and
  psychiatric conditions. Founded in 2016 by Antonio Stanziola, Tim Den Boer, Bradley
  Treeby and Michael Brown, the company is backed by Speedinvest, UCL Technology Fund,
  Fusion Fund and Jumpspace Ventures. As an early-stage medical-device company it does
  not currently publish a public developer API, SDK, or developer portal.
